<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TripPick | 旅游景点推荐</title>
  <style>
    :root{
      --bg:#0b1220;
      --card:#101a2f;
      --card2:#0f1a33;
      --text:#e7ecff;
      --muted:#9aa6d6;
      --line:rgba(255,255,255,.08);
      --accent:#7c5cff;
      --accent2:#22c55e;
      --warn:#f59e0b;
      --danger:#ef4444;
      --shadow: 0 18px 40px rgba(0,0,0,.35);
      --radius: 18px;
      --radius2: 14px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Apple Color Emoji","Segoe UI Emoji";
      color:var(--text);
      background: radial-gradient(1200px 700px at 20% -10%, rgba(124,92,255,.35), transparent 60%),
                  radial-gradient(1000px 600px at 90% 0%, rgba(34,197,94,.22), transparent 55%),
                  linear-gradient(180deg, #070b14 0%, var(--bg) 30%, #070b14 100%);
      min-height:100vh;
    }
    a{color:inherit}
    .container{max-width:1120px;margin:0 auto;padding:28px 18px 60px}
    header{
      display:flex;align-items:center;justify-content:space-between;gap:14px;
      padding:18px 18px;background:rgba(16,26,47,.55);
      border:1px solid var(--line);border-radius:var(--radius);
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
    }
    .brand{
      display:flex;align-items:center;gap:12px;min-width:220px;
    }
    .logo{
      width:42px;height:42px;border-radius:14px;
      background: linear-gradient(135deg, rgba(124,92,255,.95), rgba(34,197,94,.75));
      display:grid;place-items:center;font-weight:800;
      letter-spacing:.5px;
    }
    .brand h1{margin:0;font-size:18px;line-height:1.2}
    .brand p{margin:0;color:var(--muted);font-size:12px}
    .pill{
      display:inline-flex;align-items:center;gap:8px;
      padding:8px 10px;border-radius:999px;
      border:1px solid var(--line);
      color:var(--muted);
      background:rgba(15,26,51,.5);
      font-size:12px;
      white-space:nowrap;
    }
    .hero{
      margin-top:18px;
      display:grid;grid-template-columns: 1.2fr .8fr;gap:14px;
    }
    .heroCard{
      padding:18px;border-radius:var(--radius);
      border:1px solid var(--line);
      background: linear-gradient(180deg, rgba(16,26,47,.65), rgba(16,26,47,.4));
      box-shadow: var(--shadow);
      position:relative;overflow:hidden;
    }
    .heroCard::before{
      content:"";
      position:absolute;inset:-60px -60px auto auto;
      width:240px;height:240px;border-radius:50%;
      background: radial-gradient(circle at 30% 30%, rgba(124,92,255,.55), transparent 65%);
      filter: blur(4px);
    }
    .heroTitle{margin:0 0 8px;font-size:24px}
    .heroDesc{margin:0;color:var(--muted);line-height:1.7}
    .statRow{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap}
    .stat{
      flex:1;min-width:150px;
      padding:12px;border-radius:14px;
      border:1px solid var(--line);
      background:rgba(15,26,51,.45);
    }
    .stat b{display:block;font-size:14px;margin-bottom:4px}
    .stat span{color:var(--muted);font-size:12px}
    .filters{
      padding:18px;border-radius:var(--radius);
      border:1px solid var(--line);
      background: linear-gradient(180deg, rgba(16,26,47,.55), rgba(16,26,47,.35));
      box-shadow: var(--shadow);
      display:grid;gap:12px;
    }
    .grid2{display:grid;grid-template-columns: 1fr 1fr;gap:10px}
    .grid3{display:grid;grid-template-columns: 1fr 1fr 1fr;gap:10px}
    label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
    input,select{
      width:100%;
      padding:10px 12px;border-radius:14px;
      border:1px solid var(--line);
      background:rgba(12,18,32,.65);
      color:var(--text);
      outline:none;
    }
    input::placeholder{color:rgba(154,166,214,.7)}
    .btnRow{display:flex;gap:10px;flex-wrap:wrap}
    button{
      cursor:pointer;
      padding:10px 12px;border-radius:14px;
      border:1px solid var(--line);
      background:rgba(15,26,51,.55);
      color:var(--text);
      transition:.2s transform,.2s opacity,.2s background;
      display:inline-flex;align-items:center;gap:8px;
      user-select:none;
    }
    button:hover{transform: translateY(-1px); background:rgba(18,32,72,.55)}
    .primary{background:rgba(124,92,255,.22);border-color:rgba(124,92,255,.45)}
    .primary:hover{background:rgba(124,92,255,.28)}
    .success{background:rgba(34,197,94,.18);border-color:rgba(34,197,94,.35)}
    .danger{background:rgba(239,68,68,.14);border-color:rgba(239,68,68,.35)}
    .muted{opacity:.85}
    .sectionHead{
      margin:22px 0 10px;
      display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;
    }
    .sectionHead h2{margin:0;font-size:18px}
    .sectionHead p{margin:0;color:var(--muted);font-size:12px}
    .cards{
      display:grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap:14px;
    }
    @media (max-width: 980px){
      .hero{grid-template-columns:1fr}
      .cards{grid-template-columns: repeat(2, minmax(0, 1fr));}
    }
    @media (max-width: 640px){
      header{flex-direction:column;align-items:flex-start}
      .cards{grid-template-columns:1fr}
      .grid2,.grid3{grid-template-columns:1fr}
    }
    .card{
      border-radius:var(--radius);
      border:1px solid var(--line);
      background: linear-gradient(180deg, rgba(16,26,47,.55), rgba(16,26,47,.35));
      box-shadow: var(--shadow);
      overflow:hidden;
      display:flex;flex-direction:column;
      min-height: 380px;
      position:relative;
    }
    .img{
      height:160px;
      background: #0e1730 center/cover no-repeat;
      position:relative;
    }
    .badgeRow{
      position:absolute;top:10px;left:10px;right:10px;
      display:flex;justify-content:space-between;gap:10px;
    }
    .badge{
      padding:6px 10px;border-radius:999px;
      font-size:12px;
      background:rgba(12,18,32,.75);
      border:1px solid rgba(255,255,255,.12);
      color:var(--text);
      backdrop-filter: blur(8px);
      display:inline-flex;align-items:center;gap:6px;
    }
    .badge.accent{border-color:rgba(124,92,255,.45); background:rgba(124,92,255,.18)}
    .badge.green{border-color:rgba(34,197,94,.45); background:rgba(34,197,94,.16)}
    .badge.warn{border-color:rgba(245,158,11,.45); background:rgba(245,158,11,.14)}
    .content{padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px;flex:1}
    .titleRow{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
    .titleRow h3{margin:0;font-size:16px;line-height:1.25}
    .subtitle{color:var(--muted);font-size:12px;margin-top:2px}
    .stars{font-size:12px;color:var(--warn);white-space:nowrap}
    .desc{color:rgba(231,236,255,.88);font-size:13px;line-height:1.65;margin:0}
    .tags{display:flex;gap:8px;flex-wrap:wrap}
    .tag{
      font-size:12px;color:var(--muted);
      padding:6px 10px;border-radius:999px;
      border:1px solid var(--line);
      background:rgba(15,26,51,.4);
    }
    .actions{
      padding:12px 14px 14px;
      display:flex;gap:10px;flex-wrap:wrap;
      border-top:1px solid var(--line);
      background:rgba(9,14,26,.25);
    }
    .spacer{flex:1}
    .fav{
      position:absolute;top:10px;right:10px;
      width:36px;height:36px;border-radius:12px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(12,18,32,.75);
      display:grid;place-items:center;
      backdrop-filter: blur(8px);
    }
    .fav.on{border-color:rgba(239,68,68,.45); background:rgba(239,68,68,.16)}
    .toast{
      position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
      background:rgba(12,18,32,.85);border:1px solid rgba(255,255,255,.14);
      color:var(--text);padding:10px 12px;border-radius:999px;
      display:none;gap:8px;align-items:center;
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
      font-size:13px;
      z-index:50;
    }
    .empty{
      padding:22px;border-radius:var(--radius);
      border:1px dashed rgba(255,255,255,.18);
      color:var(--muted);
      background:rgba(16,26,47,.25);
    }
    footer{
      margin-top:26px;color:var(--muted);font-size:12px;
      display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;
      opacity:.9;
    }
    kbd{
      font-family: ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.12);
      padding:2px 6px;border-radius:8px;
      color:rgba(231,236,255,.95);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <div class="logo">TP</div>
        <div>
          <h1>TripPick | 旅游景点推荐</h1>
          <p>用筛选+收藏，快速找到你想去的地方</p>
        </div>
      </div>

      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
        <span class="pill">快捷键：<kbd>/</kbd> 搜索</span>
        <span class="pill" id="favCountPill">收藏：0</span>
      </div>
    </header>

    <div class="hero">
      <div class="heroCard">
        <h2 class="heroTitle">今天想去哪？</h2>
        <p class="heroDesc">
          这是一个轻量的景点推荐页：支持搜索、筛选、排序、收藏。
          你也可以把数据换成你自己的城市/国家景点列表。
        </p>
        <div class="statRow">
          <div class="stat">
            <b id="statTotal">—</b>
            <span>当前景点数量</span>
          </div>
          <div class="stat">
            <b id="statCities">—</b>
            <span>覆盖城市</span>
          </div>
          <div class="stat">
            <b id="statTypes">—</b>
            <span>景点类型</span>
          </div>
        </div>
      </div>

      <div class="filters">
        <div>
          <label>搜索（名称 / 城市 / 标签）</label>
          <input id="q" placeholder="例如：浅草 / 夜景 / 温泉 / 海滩" />
        </div>

        <div class="grid2">
          <div>
            <label>城市</label>
            <select id="city"></select>
          </div>
          <div>
            <label>类型</label>
            <select id="type"></select>
          </div>
        </div>

        <div class="grid3">
          <div>
            <label>预算（每人）</label>
            <select id="budget">
              <option value="all">不限</option>
              <option value="low">低（≤ ¥2,000）</option>
              <option value="mid">中（¥2,001 - ¥8,000）</option>
              <option value="high">高（≥ ¥8,001）</option>
            </select>
          </div>
          <div>
            <label>排序</label>
            <select id="sort">
              <option value="match">匹配度</option>
              <option value="rating_desc">评分高 → 低</option>
              <option value="price_asc">预算低 → 高</option>
              <option value="price_desc">预算高 → 低</option>
            </select>
          </div>
          <div>
            <label>只看收藏</label>
            <select id="onlyFav">
              <option value="no">否</option>
              <option value="yes">是</option>
            </select>
          </div>
        </div>

        <div class="btnRow">
          <button class="primary" id="btnReset">重置筛选</button>
          <button class="success" id="btnRandom">随机推荐一个</button>
          <button class="danger" id="btnClearFav">清空收藏</button>
        </div>
      </div>
    </div>

    <div class="sectionHead">
      <div>
        <h2>推荐列表</h2>
        <p id="resultInfo">—</p>
      </div>
      <div class="pill muted" id="tipPill">小提示：收藏会保存在本地浏览器</div>
    </div>

    <div id="cards" class="cards"></div>
    <div id="empty" class="empty" style="display:none">没有匹配的景点。试试换一个关键词或放宽筛选条件。</div>

    <footer>
      <div>© TripPick（示例站点）| 你可以改成自己的城市与景点数据</div>
      <div>操作：点击 ❤️ 收藏 | “地图”会打开 Google Maps 搜索</div>
    </footer>
  </div>

  <div class="toast" id="toast">已复制</div>

  <script>
    // ====== 数据：你可以在这里增删改景点 ======
    // price：建议用“每人预算（JPY）”估算
    const PLACES = [
      {
        id:"tokyo-asakusa",
        name:"浅草寺 & 仲见世",
        city:"东京",
        country:"日本",
        type:"文化",
        rating:4.7,
        price:1500,
        time:"半天",
        bestSeason:"全年",
        highlights:["雷门打卡","和风小吃","夜晚灯光"],
        tags:["寺庙","街拍","小吃","夜景"],
        image:"https://images.unsplash.com/photo-1549693578-d683be217e58?auto=format&fit=crop&w=1400&q=70",
        note:"适合第一次来东京，交通方便，周边还能顺路去晴空塔。"
      },
      {
        id:"tokyo-shibuya",
        name:"涩谷十字路口 & 天空观景",
        city:"东京",
        country:"日本",
        type:"城市",
        rating:4.6,
        price:3000,
        time:"2-4小时",
        bestSeason:"全年",
        highlights:["人潮震撼","城市摄影","高空夜景"],
        tags:["地标","夜景","购物","拍照"],
        image:"https://images.unsplash.com/photo-1526481280695-3c687fd643ed?auto=format&fit=crop&w=1400&q=70",
        note:"建议傍晚去：先逛街再看夜景，氛围拉满。"
      },
      {
        id:"tokyo-odaiba",
        name:"台场海滨公园",
        city:"东京",
        country:"日本",
        type:"海滨",
        rating:4.5,
        price:2500,
        time:"半天",
        bestSeason:"春/秋",
        highlights:["海边散步","彩虹大桥","日落氛围"],
        tags:["海景","日落","放松","情侣"],
        image:"https://images.unsplash.com/photo-1526481280695-3c687fd643ed?auto=format&fit=crop&w=1400&q=55",
        note:"适合放空+散步，天气好时很出片。"
      },
      {
        id:"kyoto-fushimi",
        name:"伏见稻荷大社（千本鸟居）",
        city:"京都",
        country:"日本",
        type:"文化",
        rating:4.8,
        price:1200,
        time:"半天",
        bestSeason:"全年",
        highlights:["千本鸟居","登山小径","清晨人少"],
        tags:["神社","徒步","摄影","鸟居"],
        image:"https://images.unsplash.com/photo-1545569341-9eb8b30979d9?auto=format&fit=crop&w=1400&q=70",
        note:"越往上人越少，建议早起去，体验最好。"
      },
      {
        id:"kyoto-arashiyama",
        name:"岚山竹林 & 渡月桥",
        city:"京都",
        country:"日本",
        type:"自然",
        rating:4.6,
        price:3000,
        time:"半天-一天",
        bestSeason:"春/秋",
        highlights:["竹林步道","河边风景","和服体验"],
        tags:["自然","散步","拍照","和风"],
        image:"https://images.unsplash.com/photo-1503899036084-c55cdd92da26?auto=format&fit=crop&w=1400&q=70",
        note:"可以把天龙寺、嵯峨野小火车一起安排成一日路线。"
      },
      {
        id:"osaka-dotonbori",
        name:"道顿堀美食街",
        city:"大阪",
        country:"日本",
        type:"美食",
        rating:4.5,
        price:5000,
        time:"晚上",
        bestSeason:"全年",
        highlights:["章鱼烧","霓虹夜景","逛街氛围"],
        tags:["美食","夜景","购物","热闹"],
        image:"https://images.unsplash.com/photo-1562184647-7c64b8b3f9e8?auto=format&fit=crop&w=1400&q=70",
        note:"适合夜游：吃吃喝喝+拍照，热闹到不想回酒店。"
      },
      {
        id:"hokkaido-otaru",
        name:"小樽运河",
        city:"北海道",
        country:"日本",
        type:"城市",
        rating:4.6,
        price:4000,
        time:"半天",
        bestSeason:"冬/夏",
        highlights:["运河夜景","玻璃工艺","甜品咖啡"],
        tags:["夜景","文艺","拍照","散步"],
        image:"https://images.unsplash.com/photo-1518548419970-58e3b4079ab2?auto=format&fit=crop&w=1400&q=70",
        note:"冬季雪景很浪漫，夏季也适合慢逛。"
      },
      {
        id:"okinawa-beach",
        name:"冲绳海滩浮潜（示例）",
        city:"冲绳",
        country:"日本",
        type:"海滨",
        rating:4.7,
        price:12000,
        time:"半天",
        bestSeason:"夏",
        highlights:["清澈海水","浮潜体验","度假放松"],
        tags:["海滩","浮潜","度假","亲子"],
        image:"https://images.unsplash.com/photo-1500375592092-40eb2168fd21?auto=format&fit=crop&w=1400&q=70",
        note:"预算较高，但体验“度假感”直接拉满。"
      }
    ];

    // ====== 工具函数 ======
    const $ = (id)=>document.getElementById(id);
    const clamp = (n,min,max)=>Math.max(min,Math.min(max,n));
    const yen = (n)=>"¥" + n.toLocaleString("ja-JP");
    const starText = (r)=>{
      const full = Math.floor(r);
      const half = (r - full) >= 0.5 ? 1 : 0;
      return "★".repeat(full) + (half ? "½" : "");
    };

    // 评分→推荐级别
    function ratingBadge(r){
      if(r >= 4.75) return {text:"爆款推荐", cls:"accent"};
      if(r >= 4.60) return {text:"高口碑", cls:"green"};
      return {text:"值得一去", cls:"warn"};
    }

    // 预算档
    function budgetBucket(price){
      if(price <= 2000) return "low";
      if(price <= 8000) return "mid";
      return "high";
    }

    // 简单匹配度：关键词命中 + 类型/城市匹配
    function scorePlace(p, query, city, type, budget){
      let s = 0;
      const q = query.trim().toLowerCase();
      if(q){
        const hay = (p.name+" "+p.city+" "+p.type+" "+p.tags.join(" ")).toLowerCase();
        if(hay.includes(q)) s += 8;
        // 拆分关键词加分
        q.split(/\s+/).filter(Boolean).forEach(k=>{
          if(hay.includes(k)) s += 2;
        });
      } else {
        s += 1;
      }
      if(city !== "all" && p.city === city) s += 3;
      if(type !== "all" && p.type === type) s += 3;
      if(budget !== "all" && budgetBucket(p.price) === budget) s += 2;
      return s;
    }

    // ====== 收藏（localStorage） ======
    const FAV_KEY = "trippick_favs_v1";
    function getFavs(){
      try{
        const raw = localStorage.getItem(FAV_KEY);
        const arr = raw ? JSON.parse(raw) : [];
        return Array.isArray(arr) ? arr : [];
      }catch{ return []; }
    }
    function setFavs(arr){
      localStorage.setItem(FAV_KEY, JSON.stringify(arr));
      updateFavCount();
    }
    function isFav(id){
      return getFavs().includes(id);
    }
    function toggleFav(id){
      const favs = getFavs();
      const idx = favs.indexOf(id);
      if(idx >= 0) favs.splice(idx,1);
      else favs.unshift(id);
      setFavs(favs);
    }
    function updateFavCount(){
      const n = getFavs().length;
      $("favCountPill").textContent = `收藏：${n}`;
    }

    // ====== UI：toast ======
    let toastTimer = null;
    function toast(msg){
      const t = $("toast");
      t.textContent = msg;
      t.style.display = "inline-flex";
      clearTimeout(toastTimer);
      toastTimer = setTimeout(()=>{ t.style.display="none"; }, 1400);
    }

    // ====== 渲染 ======
    function buildSelectOptions(){
      const cities = Array.from(new Set(PLACES.map(p=>p.city))).sort();
      const types = Array.from(new Set(PLACES.map(p=>p.type))).sort();

      $("city").innerHTML = `<option value="all">全部</option>` + cities.map(c=>`<option value="${c}">${c}</option>`).join("");
      $("type").innerHTML = `<option value="all">全部</option>` + types.map(t=>`<option value="${t}">${t}</option>`).join("");

      $("statTotal").textContent = PLACES.length;
      $("statCities").textContent = cities.length;
      $("statTypes").textContent = types.length;
    }

    function render(){
      const query = $("q").value || "";
      const city = $("city").value;
      const type = $("type").value;
      const budget = $("budget").value;
      const sort = $("sort").value;
      const onlyFav = $("onlyFav").value === "yes";
      const favs = getFavs();

      let list = PLACES
        .map(p=>({ ...p, _score: scorePlace(p, query, city, type, budget) }))
        .filter(p=>{
          if(onlyFav && !favs.includes(p.id)) return false;
          if(city !== "all" && p.city !== city) return false;
          if(type !== "all" && p.type !== type) return false;
          if(budget !== "all" && budgetBucket(p.price) !== budget) return false;
          if(query.trim()){
            const hay = (p.name+" "+p.city+" "+p.type+" "+p.tags.join(" ")).toLowerCase();
            const q = query.trim().toLowerCase();
            // 必须至少命中一次
            if(!hay.includes(q)){
              // 允许拆词命中（任意一个）
              const ks = q.split(/\s+/).filter(Boolean);
              if(ks.length && !ks.some(k=>hay.includes(k))) return false;
            }
          }
          return true;
        });

      if(sort === "rating_desc") list.sort((a,b)=>b.rating - a.rating);
      else if(sort === "price_asc") list.sort((a,b)=>a.price - b.price);
      else if(sort === "price_desc") list.sort((a,b)=>b.price - a.price);
      else list.sort((a,b)=>b._score - a._score || b.rating - a.rating);

      $("resultInfo").textContent = `共找到 ${list.length} 个结果（从 ${PLACES.length} 个景点中筛选）`;
      $("empty").style.display = list.length ? "none" : "block";

      const cards = $("cards");
      cards.innerHTML = list.map(p=>{
        const rb = ratingBadge(p.rating);
        const favOn = isFav(p.id);
        const mapQ = encodeURIComponent(`${p.name} ${p.city} ${p.country}`);
        const mapUrl = `https://www.google.com/maps/search/?api=1&query=${mapQ}`;

        return `
          <article class="card">
            <div class="img" style="background-image:url('${p.image}')">
              <div class="badgeRow">
                <span class="badge ${rb.cls}">✨ ${rb.text}</span>
                <span class="badge">⏱ ${p.time}</span>
              </div>
              <button class="fav ${favOn ? "on" : ""}" title="收藏" data-fav="${p.id}">${favOn ? "❤️" : "🤍"}</button>
            </div>

            <div class="content">
              <div class="titleRow">
                <div>
                  <h3>${p.name}</h3>
                  <div class="subtitle">${p.city} · ${p.type} · 适合：${p.bestSeason}</div>
                </div>
                <div class="stars" title="评分">${starText(p.rating)} ${p.rating.toFixed(1)}</div>
              </div>

              <p class="desc">${p.note}</p>

              <div class="tags">
                <span class="tag">预算 ${yen(p.price)}/人</span>
                ${p.highlights.slice(0,3).map(h=>`<span class="tag">✅ ${h}</span>`).join("")}
              </div>

              <div class="tags">
                ${p.tags.slice(0,4).map(t=>`<span class="tag">#${t}</span>`).join("")}
              </div>
            </div>

            <div class="actions">
              <button class="primary" data-map="${mapUrl}">🗺 地图</button>
              <button class="success" data-copy="${p.id}">📋 复制</button>
              <span class="spacer"></span>
              <button data-more="${p.id}">ℹ️ 详情</button>
            </div>
          </article>
        `;
      }).join("");

      // 绑定事件（事件委托）
      cards.querySelectorAll("[data-fav]").forEach(btn=>{
        btn.addEventListener("click", (e)=>{
          const id = e.currentTarget.getAttribute("data-fav");
          toggleFav(id);
          render();
          toast(isFav(id) ? "已收藏" : "已取消收藏");
        });
      });

      cards.querySelectorAll("[data-map]").forEach(btn=>{
        btn.addEventListener("click",(e)=>{
          const url = e.currentTarget.getAttribute("data-map");
          window.open(url, "_blank", "noopener");
        });
      });

      cards.querySelectorAll("[data-copy]").forEach(btn=>{
        btn.addEventListener("click", async (e)=>{
          const id = e.currentTarget.getAttribute("data-copy");
          const p = PLACES.find(x=>x.id===id);
          const text =
`【${p.name}】
地点：${p.city} · ${p.country}
类型：${p.type}
评分：${p.rating}
预算：${yen(p.price)}/人
亮点：${p.highlights.join(" / ")}
标签：${p.tags.join(", ")}
推荐：${p.note}`;
          try{
            await navigator.clipboard.writeText(text);
            toast("已复制到剪贴板");
          }catch{
            // 兜底：旧浏览器
            const ta = document.createElement("textarea");
            ta.value = text; document.body.appendChild(ta);
            ta.select(); document.execCommand("copy");
            document.body.removeChild(ta);
            toast("已复制");
          }
        });
      });

      cards.querySelectorAll("[data-more]").forEach(btn=>{
        btn.addEventListener("click",(e)=>{
          const id = e.currentTarget.getAttribute("data-more");
          const p = PLACES.find(x=>x.id===id);
          alert(
`📍 ${p.name}
城市：${p.city}（${p.country}）
类型：${p.type}
推荐季节：${p.bestSeason}
建议时长：${p.time}
评分：${p.rating}
预算：${yen(p.price)}/人

亮点：
- ${p.highlights.join("\n- ")}

标签：
- ${p.tags.join("\n- ")}`
          );
        });
      });
    }

    // ====== 交互 ======
    function resetFilters(){
      $("q").value = "";
      $("city").value = "all";
      $("type").value = "all";
      $("budget").value = "all";
      $("sort").value = "match";
      $("onlyFav").value = "no";
      render();
      toast("已重置");
    }

    function randomPick(){
      // 按当前筛选条件从结果里随机
      const query = $("q").value || "";
      const city = $("city").value;
      const type = $("type").value;
      const budget = $("budget").value;
      const onlyFav = $("onlyFav").value === "yes";
      const favs = getFavs();

      const candidates = PLACES.filter(p=>{
        if(onlyFav && !favs.includes(p.id)) return false;
        if(city !== "all" && p.city !== city) return false;
        if(type !== "all" && p.type !== type) return false;
        if(budget !== "all" && budgetBucket(p.price) !== budget) return false;
        if(query.trim()){
          const hay = (p.name+" "+p.city+" "+p.type+" "+p.tags.join(" ")).toLowerCase();
          const q = query.trim().toLowerCase();
          const ks = q.split(/\s+/).filter(Boolean);
          if(!hay.includes(q) && !(ks.length && ks.some(k=>hay.includes(k)))) return false;
        }
        return true;
      });

      if(!candidates.length){
        toast("没有可随机的结果");
        return;
      }
      const p = candidates[Math.floor(Math.random()*candidates.length)];
      toast(`随机推荐：${p.name}`);
      // 轻微定位到顶部，用户马上能看到提示再自己找
      window.scrollTo({top: 0, behavior:"smooth"});
      // 也可以自动弹详情
      setTimeout(()=>alert(`🎲 随机推荐：${p.name}\n\n地点：${p.city}\n类型：${p.type}\n预算：${yen(p.price)}/人\n\n${p.note}`), 300);
    }

    function clearFavs(){
      setFavs([]);
      render();
      toast("已清空收藏");
    }

    // 搜索快捷键 /
    window.addEventListener("keydown",(e)=>{
      if(e.key === "/" && document.activeElement !== $("q")){
        e.preventDefault();
        $("q").focus();
      }
      if(e.key === "Escape"){
        document.activeElement?.blur?.();
      }
    });

    // ====== 初始化 ======
    buildSelectOptions();
    updateFavCount();
    render();

    // 监听筛选变化
    ["q","city","type","budget","sort","onlyFav"].forEach(id=>{
      $(id).addEventListener(id==="q" ? "input" : "change", render);
    });

    $("btnReset").addEventListener("click", resetFilters);
    $("btnRandom").addEventListener("click", randomPick);
    $("btnClearFav").addEventListener("click", clearFavs);
  </script>
</body>
</html>
