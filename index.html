<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TripPick | 旅游景点</title>
  <style>
    :root{
      --bg: #f6fbff;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --line: #dbeafe;          /* 浅蓝边框 */
      --blue: #38bdf8;          /* 浅蓝主色 */
      --blue-2: #0ea5e9;
      --chip: #eff6ff;
      --shadow: 0 10px 24px rgba(15, 23, 42, .06);
      --radius: 16px;
      --radius2: 12px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      background: var(--bg);
      color: var(--text);
    }
    .container{max-width:1120px;margin:0 auto;padding:22px 16px 56px}
    header{
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px 16px;
      display:flex; align-items:center; justify-content:space-between; gap:14px;
    }
    .brand{display:flex; align-items:center; gap:12px; min-width:240px}
    .logo{
      width:40px;height:40px;border-radius:14px;
      display:grid;place-items:center;
      background: linear-gradient(135deg, #7dd3fc, #38bdf8);
      color:white;font-weight:800;
      letter-spacing:.5px;
    }
    .brand h1{margin:0;font-size:16px}
    .brand p{margin:2px 0 0;color:var(--muted);font-size:12px}
    .topRight{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .pill{
      display:inline-flex;align-items:center;gap:8px;
      padding:8px 10px;border-radius:999px;
      border:1px solid var(--line);
      background:#ffffff;
      color:var(--muted);
      font-size:12px;
      white-space:nowrap;
    }
    kbd{
      font-family: ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
      background:#ffffff;
      border:1px solid var(--line);
      padding:2px 6px;border-radius:8px;
      color:var(--text);
    }

    .layout{
      margin-top:14px;
      display:grid;
      grid-template-columns: 320px 1fr;
      gap:14px;
    }
    @media (max-width: 920px){
      .layout{grid-template-columns:1fr}
    }

    .panel{
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px;
      height: fit-content;
    }
    .panel h2{margin:0 0 10px;font-size:14px}
    label{display:block;font-size:12px;color:var(--muted);margin:10px 0 6px}
    input,select{
      width:100%;
      padding:10px 12px;
      border-radius: var(--radius2);
      border:1px solid var(--line);
      background:#ffffff;
      color:var(--text);
      outline:none;
    }
    input:focus, select:focus{
      border-color: rgba(56,189,248,.8);
      box-shadow: 0 0 0 4px rgba(56,189,248,.15);
    }
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
    @media (max-width: 520px){
      .grid2,.grid3{grid-template-columns:1fr}
    }

    .btnRow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
    button{
      cursor:pointer;
      padding:10px 12px;
      border-radius: var(--radius2);
      border:1px solid var(--line);
      background:#ffffff;
      color:var(--text);
      transition:.15s transform,.15s box-shadow,.15s border-color;
      display:inline-flex;align-items:center;gap:8px;
      user-select:none;
    }
    button:hover{
      transform: translateY(-1px);
      box-shadow: 0 10px 18px rgba(15, 23, 42, .06);
      border-color: rgba(56,189,248,.75);
    }
    .primary{
      background: rgba(56,189,248,.12);
      border-color: rgba(56,189,248,.55);
      color: #075985;
    }
    .danger{
      background: rgba(239,68,68,.08);
      border-color: rgba(239,68,68,.25);
      color: #7f1d1d;
    }

    .main{
      min-width: 0;
    }
    .sectionHead{
      display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;
      margin-bottom:10px;
    }
    .sectionHead h2{margin:0;font-size:14px}
    .sectionHead p{margin:0;color:var(--muted);font-size:12px}

    .cards{
      display:grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap:14px;
    }
    @media (max-width: 1100px){
      .cards{grid-template-columns: repeat(2, minmax(0, 1fr));}
    }
    @media (max-width: 650px){
      .cards{grid-template-columns:1fr}
    }

    .card{
      background: var(--card);
      border:1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
      display:flex;
      flex-direction:column;
      min-height: 340px;
    }
    .img{
      height:150px;
      background: #e0f2fe center/cover no-repeat;
      position:relative;
    }
    .fav{
      position:absolute; top:10px; right:10px;
      width:34px; height:34px;
      border-radius: 12px;
      border:1px solid var(--line);
      background:#ffffff;
      display:grid; place-items:center;
    }
    .fav.on{
      border-color: rgba(239,68,68,.35);
      background: rgba(239,68,68,.08);
    }

    .content{padding:12px 12px 10px;display:flex;flex-direction:column;gap:10px;flex:1}
    .titleRow{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
    .titleRow h3{margin:0;font-size:15px;line-height:1.25}
    .meta{color:var(--muted);font-size:12px;margin-top:2px}
    .rating{font-size:12px;color:var(--muted);white-space:nowrap}
    .desc{margin:0;color:var(--text);opacity:.9;font-size:13px;line-height:1.6}
    .chips{display:flex;gap:8px;flex-wrap:wrap}
    .chip{
      font-size:12px;
      color: #075985;
      background: var(--chip);
      border:1px solid var(--line);
      padding:6px 10px;
      border-radius:999px;
    }
    .chip.muted{
      color: var(--muted);
      background:#ffffff;
    }

    .actions{
      padding:10px 12px 12px;
      display:flex;gap:10px;flex-wrap:wrap;
      border-top:1px solid var(--line);
    }
    .spacer{flex:1}

    .empty{
      background: var(--card);
      border: 1px dashed rgba(56,189,248,.5);
      border-radius: var(--radius);
      padding: 18px;
      color: var(--muted);
    }

    .toast{
      position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
      background:#ffffff;
      border:1px solid var(--line);
      color:var(--text);
      padding:10px 12px;border-radius:999px;
      display:none;gap:8px;align-items:center;
      box-shadow: var(--shadow);
      font-size:13px;
      z-index:50;
    }

    footer{
      margin-top:18px;
      color: var(--muted);
      font-size:12px;
      display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <div class="logo">TP</div>
        <div>
          <h1>TripPick</h1>
          <p>旅游景点信息检索</p>
        </div>
      </div>
      <div class="topRight">
        <span class="pill">快捷键：<kbd>/</kbd> 搜索</span>
        <span class="pill" id="favCountPill">收藏：0</span>
      </div>
    </header>

    <div class="layout">
      <aside class="panel">
        <h2>筛选</h2>

        <label>搜索（名称 / 城市 / 标签）</label>
        <input id="q" placeholder="例如：浅草 / 温泉 / 夜景" />

        <div class="grid2">
          <div>
            <label>城市</label>
            <select id="city"></select>
          </div>
          <div>
            <label>类型</label>
            <select id="type"></select>
          </div>
        </div>

        <div class="grid3">
          <div>
            <label>预算（每人）</label>
            <select id="budget">
              <option value="all">不限</option>
              <option value="low">低（≤ ¥2,000）</option>
              <option value="mid">中（¥2,001 - ¥8,000）</option>
              <option value="high">高（≥ ¥8,001）</option>
            </select>
          </div>
          <div>
            <label>排序</label>
            <select id="sort">
              <option value="match">匹配度</option>
              <option value="rating_desc">评分高 → 低</option>
              <option value="price_asc">预算低 → 高</option>
              <option value="price_desc">预算高 → 低</option>
            </select>
          </div>
          <div>
            <label>只看收藏</label>
            <select id="onlyFav">
              <option value="no">否</option>
              <option value="yes">是</option>
            </select>
          </div>
        </div>

        <div class="btnRow">
          <button class="primary" id="btnReset">重置</button>
          <button class="primary" id="btnRandom">随机</button>
          <button class="danger" id="btnClearFav">清空收藏</button>
        </div>

        <div style="margin-top:12px;color:var(--muted);font-size:12px;line-height:1.6">
          数据来源：<code>places.json</code><br>
          收藏存储：浏览器本地
        </div>
      </aside>

      <main class="main">
        <div class="sectionHead">
          <div>
            <h2>景点列表</h2>
            <p id="resultInfo">—</p>
          </div>
          <div class="pill" id="statsPill">—</div>
        </div>

        <div id="cards" class="cards"></div>
        <div id="empty" class="empty" style="display:none">没有匹配的结果。</div>

        <footer>
          <div>© TripPick</div>
          <div>地图：打开 Google Maps 搜索</div>
        </footer>
      </main>
    </div>
  </div>

  <div class="toast" id="toast">已复制</div>

  <script>
    // ====== 从 places.json 读取数据（保持与之前字段一致） ======
    let PLACES = [];

    const $ = (id)=>document.getElementById(id);
    const yen = (n)=>"¥" + Number(n).toLocaleString("ja-JP");

    function budgetBucket(price){
      const p = Number(price);
      if(p <= 2000) return "low";
      if(p <= 8000) return "mid";
      return "high";
    }

    function scorePlace(p, query, city, type, budget){
      let s = 0;
      const q = query.trim().toLowerCase();
      if(q){
        const hay = (p.name+" "+p.city+" "+p.type+" "+(p.tags||[]).join(" ")).toLowerCase();
        if(hay.includes(q)) s += 8;
        q.split(/\s+/).filter(Boolean).forEach(k=>{
          if(hay.includes(k)) s += 2;
        });
      } else {
        s += 1;
      }
      if(city !== "all" && p.city === city) s += 3;
      if(type !== "all" && p.type === type) s += 3;
      if(budget !== "all" && budgetBucket(p.price) === budget) s += 2;
      return s;
    }

    // ====== 收藏（localStorage） ======
    const FAV_KEY = "trippick_favs_v2";
    function getFavs(){
      try{
        const raw = localStorage.getItem(FAV_KEY);
        const arr = raw ? JSON.parse(raw) : [];
        return Array.isArray(arr) ? arr : [];
      }catch{ return []; }
    }
    function setFavs(arr){
      localStorage.setItem(FAV_KEY, JSON.stringify(arr));
      updateFavCount();
    }
    function isFav(id){ return getFavs().includes(id); }
    function toggleFav(id){
      const favs = getFavs();
      const idx = favs.indexOf(id);
      if(idx >= 0) favs.splice(idx,1);
      else favs.unshift(id);
      setFavs(favs);
    }
    function updateFavCount(){
      $("favCountPill").textContent = `收藏：${getFavs().length}`;
    }

    // ====== toast ======
    let toastTimer = null;
    function toast(msg){
      const t = $("toast");
      t.textContent = msg;
      t.style.display = "inline-flex";
      clearTimeout(toastTimer);
      toastTimer = setTimeout(()=>{ t.style.display="none"; }, 1200);
    }

    // ====== UI ======
    function buildSelectOptions(){
      const cities = Array.from(new Set(PLACES.map(p=>p.city))).sort();
      const types  = Array.from(new Set(PLACES.map(p=>p.type))).sort();
      $("city").innerHTML = `<option value="all">全部</option>` + cities.map(c=>`<option value="${c}">${c}</option>`).join("");
      $("type").innerHTML = `<option value="all">全部</option>` + types.map(t=>`<option value="${t}">${t}</option>`).join("");
      $("statsPill").textContent = `景点：${PLACES.length} · 城市：${cities.length} · 类型：${types.length}`;
    }

    function render(){
      const query = $("q").value || "";
      const city = $("city").value;
      const type = $("type").value;
      const budget = $("budget").value;
      const sort = $("sort").value;
      const onlyFav = $("onlyFav").value === "yes";
      const favs = getFavs();

      let list = PLACES
        .map(p=>({ ...p, _score: scorePlace(p, query, city, type, budget) }))
        .filter(p=>{
          if(onlyFav && !favs.includes(p.id)) return false;
          if(city !== "all" && p.city !== city) return false;
          if(type !== "all" && p.type !== type) return false;
          if(budget !== "all" && budgetBucket(p.price) !== budget) return false;

          if(query.trim()){
            const hay = (p.name+" "+p.city+" "+p.type+" "+(p.tags||[]).join(" ")).toLowerCase();
            const q = query.trim().toLowerCase();
            if(!hay.includes(q)){
              const ks = q.split(/\s+/).filter(Boolean);
              if(ks.length && !ks.some(k=>hay.includes(k))) return false;
            }
          }
          return true;
        });

      if(sort === "rating_desc") list.sort((a,b)=>Number(b.rating) - Number(a.rating));
      else if(sort === "price_asc") list.sort((a,b)=>Number(a.price) - Number(b.price));
      else if(sort === "price_desc") list.sort((a,b)=>Number(b.price) - Number(a.price));
      else list.sort((a,b)=>b._score - a._score || Number(b.rating) - Number(a.rating));

      $("resultInfo").textContent = `结果：${list.length} / ${PLACES.length}`;
      $("empty").style.display = list.length ? "none" : "block";

      const cards = $("cards");
      cards.innerHTML = list.map(p=>{
        const favOn = isFav(p.id);
        const mapQ = encodeURIComponent(`${p.name} ${p.city} ${p.country || ""}`.trim());
        const mapUrl = `https://www.google.com/maps/search/?api=1&query=${mapQ}`;

        const tags = (p.tags || []).slice(0,4);
        return `
          <article class="card">
            <div class="img" style="background-image:url('${p.image || ""}')">
              <button class="fav ${favOn ? "on" : ""}" title="收藏" data-fav="${p.id}">${favOn ? "❤️" : "🤍"}</button>
            </div>

            <div class="content">
              <div class="titleRow">
                <div>
                  <h3>${p.name}</h3>
                  <div class="meta">${p.city} · ${p.type}</div>
                </div>
                <div class="rating">评分 ${Number(p.rating).toFixed(1)}</div>
              </div>

              <div class="chips">
                <span class="chip">${yen(p.price)}/人</span>
                <span class="chip muted">${p.time || "—"}</span>
                <span class="chip muted">${p.bestSeason || "—"}</span>
              </div>

              <p class="desc">${p.note || ""}</p>

              <div class="chips">
                ${tags.map(t=>`<span class="chip muted">#${t}</span>`).join("")}
              </div>
            </div>

            <div class="actions">
              <button class="primary" data-map="${mapUrl}">地图</button>
              <button data-copy="${p.id}">复制信息</button>
              <span class="spacer"></span>
              <button data-more="${p.id}">详情</button>
            </div>
          </article>
        `;
      }).join("");

      // 绑定事件
      cards.querySelectorAll("[data-fav]").forEach(btn=>{
        btn.addEventListener("click", (e)=>{
          const id = e.currentTarget.getAttribute("data-fav");
          toggleFav(id);
          render();
          toast(isFav(id) ? "已收藏" : "已取消");
        });
      });

      cards.querySelectorAll("[data-map]").forEach(btn=>{
        btn.addEventListener("click",(e)=>{
          const url = e.currentTarget.getAttribute("data-map");
          window.open(url, "_blank", "noopener");
        });
      });

      cards.querySelectorAll("[data-copy]").forEach(btn=>{
        btn.addEventListener("click", async (e)=>{
          const id = e.currentTarget.getAttribute("data-copy");
          const p = PLACES.find(x=>x.id===id);
          const text =
`【${p.name}】
城市：${p.city}
国家：${p.country || ""}
类型：${p.type}
评分：${p.rating}
预算：${yen(p.price)}/人
时长：${p.time || ""}
季节：${p.bestSeason || ""}
标签：${(p.tags||[]).join(", ")}
备注：${p.note || ""}`.trim();
          try{
            await navigator.clipboard.writeText(text);
            toast("已复制");
          }catch{
            const ta = document.createElement("textarea");
            ta.value = text; document.body.appendChild(ta);
            ta.select(); document.execCommand("copy");
            document.body.removeChild(ta);
            toast("已复制");
          }
        });
      });

      cards.querySelectorAll("[data-more]").forEach(btn=>{
        btn.addEventListener("click",(e)=>{
          const id = e.currentTarget.getAttribute("data-more");
          const p = PLACES.find(x=>x.id===id);
          alert(
`景点：${p.name}
城市：${p.city}（${p.country || "—"}）
类型：${p.type}
评分：${p.rating}
预算：${yen(p.price)}/人
建议时长：${p.time || "—"}
推荐季节：${p.bestSeason || "—"}

亮点：
- ${(p.highlights||[]).join("\n- ") || "—"}

标签：
- ${(p.tags||[]).join("\n- ") || "—"}`
          );
        });
      });
    }

    function resetFilters(){
      $("q").value = "";
      $("city").value = "all";
      $("type").value = "all";
      $("budget").value = "all";
      $("sort").value = "match";
      $("onlyFav").value = "no";
      render();
      toast("已重置");
    }

    function randomPick(){
      const query = $("q").value || "";
      const city = $("city").value;
      const type = $("type").value;
      const budget = $("budget").value;
      const onlyFav = $("onlyFav").value === "yes";
      const favs = getFavs();

      const candidates = PLACES.filter(p=>{
        if(onlyFav && !favs.includes(p.id)) return false;
        if(city !== "all" && p.city !== city) return false;
        if(type !== "all" && p.type !== type) return false;
        if(budget !== "all" && budgetBucket(p.price) !== budget) return false;

        if(query.trim()){
          const hay = (p.name+" "+p.city+" "+p.type+" "+(p.tags||[]).join(" ")).toLowerCase();
          const q = query.trim().toLowerCase();
          const ks = q.split(/\s+/).filter(Boolean);
          if(!hay.includes(q) && !(ks.length && ks.some(k=>hay.includes(k)))) return false;
        }
        return true;
      });

      if(!candidates.length){
        toast("无可选结果");
        return;
      }
      const p = candidates[Math.floor(Math.random()*candidates.length)];
      toast(`随机：${p.name}`);
      setTimeout(()=>alert(`随机：${p.name}\n城市：${p.city}\n类型：${p.type}\n预算：${yen(p.price)}/人`), 250);
    }

    function clearFavs(){
      setFavs([]);
      render();
      toast("已清空");
    }

    // 快捷键 /
    window.addEventListener("keydown",(e)=>{
      if(e.key === "/" && document.activeElement !== $("q")){
        e.preventDefault();
        $("q").focus();
      }
      if(e.key === "Escape"){
        document.activeElement?.blur?.();
      }
    });

    async function loadPlaces(){
      try{
        const res = await fetch("./places.json", { cache:"no-store" });
        if(!res.ok) throw new Error("places.json 读取失败");
        PLACES = await res.json();
        buildSelectOptions();
        updateFavCount();
        render();
      }catch(err){
        console.error(err);
        $("empty").style.display = "block";
        $("empty").textContent = "加载 places.json 失败：请确认 places.json 与 index.html 在同一目录，并用本地服务器打开。";
      }
    }

    // 监听筛选变化
    ["q","city","type","budget","sort","onlyFav"].forEach(id=>{
      $(id).addEventListener(id==="q" ? "input" : "change", render);
    });
    $("btnReset").addEventListener("click", resetFilters);
    $("btnRandom").addEventListener("click", randomPick);
    $("btnClearFav").addEventListener("click", clearFavs);

    loadPlaces();
  </script>
</body>
</html>
